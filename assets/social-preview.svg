  <circle cx="1110" cy="80" r="290" fill="#667eea" opacity=".08"/>
  <circle cx="90" cy="650" r="300" fill="#8bd5ca" opacity=".06"/>

  <g transform="translate(90 112)">
    <rect width="220" height="220" rx="42" fill="#282536"/>
    <rect x="12" y="12" width="196" height="196" rx="32" fill="none" stroke="#667eea" stroke-width="6"/>
