<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 900" role="img" aria-labelledby="title description">
  <title id="title">pi-session-minimap compact and expanded views</title>
  <desc id="description">The compact minimap stays visible beside a pi session. The expanded dashboard reveals semantic goals, context pressure, cost, tools, failures, and decisions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#090811" flood-opacity=".45"/>
    </filter>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#8bd5ca"/>
      <stop offset="1" stop-color="#667eea"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="900" fill="#1f1d2a"/>
  <circle cx="1650" cy="80" r="330" fill="#667eea" opacity=".07"/>
  <circle cx="70" cy="850" r="300" fill="#8bd5ca" opacity=".05"/>
  <rect x="56" y="52" width="10" height="70" rx="5" fill="url(#accent)"/>
  <text x="88" y="88" fill="#cad3f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700">Compact and expanded views</text>
  <text x="90" y="124" fill="#a5adcb" font-family="system-ui, sans-serif" font-size="22">Current work and completed steps, beside the conversation.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="165" width="610" height="640" rx="24" fill="#282536" stroke="#48435e" stroke-width="2"/>
    <rect x="690" y="165" width="1060" height="640" rx="24" fill="#282536" stroke="#48435e" stroke-width="2"/>
  </g>

  <circle cx="82" cy="200" r="6" fill="#ed8796"/>
  <circle cx="102" cy="200" r="6" fill="#eed49f"/>
  <circle cx="122" cy="200" r="6" fill="#a6da95"/>
  <text x="146" y="207" fill="#8bd5ca" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">COMPACT MINIMAP</text>
  <text x="626" y="207" text-anchor="end" fill="#6e6a86" font-family="system-ui, sans-serif" font-size="18">beside the conversation</text>

  <rect x="74" y="230" width="562" height="468" rx="8" fill="#211f2d" stroke="#667eea" stroke-width="2"/>
  <image x="74" y="230" width="562" height="468" xlink:href="compact.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="78" y="744" fill="#cad3f5" font-family="system-ui, sans-serif" font-size="22" font-weight="650">Current task, completed steps, context, and cost.</text>
  <text x="78" y="775" fill="#a5adcb" font-family="system-ui, sans-serif" font-size="18">The pane stays visible while you work.</text>

  <circle cx="722" cy="200" r="6" fill="#ed8796"/>
  <circle cx="742" cy="200" r="6" fill="#eed49f"/>
  <circle cx="762" cy="200" r="6" fill="#a6da95"/>
  <text x="786" y="207" fill="#8bd5ca" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">EXPANDED DASHBOARD</text>
  <text x="1716" y="207" text-anchor="end" fill="#6e6a86" font-family="system-ui, sans-serif" font-size="18">full session detail</text>

  <rect x="714" y="230" width="1012" height="420" rx="8" fill="#211f2d" stroke="#667eea" stroke-width="2"/>
  <image x="714" y="230" width="1012" height="420" xlink:href="expanded.png" preserveAspectRatio="xMidYMid meet"/>

  <text x="714" y="702" fill="#cad3f5" font-family="system-ui, sans-serif" font-size="22" font-weight="650">Timeline, context, cost, tools, failures, and decisions.</text>
  <text x="714" y="738" fill="#a5adcb" font-family="system-ui, sans-serif" font-size="18">Open with Ctrl+Shift+M. The conversation remains visible behind the dashboard.</text>
</svg>
